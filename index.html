<style>
  :root{
    --navy:#003366;
    --navy-dark:#00264d;
    --orange:#E8500A;
    --orange-hover:#ff6a24;
    --orange-soft:#fff1e9;
    --orange-soft2:#fde3d5;
    --orange-soft3:#fde6d6;
    --white:#FFFFFF;
    --gray-bg:#F5F5F5;
    --border:#e3e7ec;
    --text:#1d2733;
    --muted:#5b6b7c;
    --servico:#003366;
    --problema:#E8500A;
    --indeterminado:#9aa7b4;
    --sucesso:#1c7a3e;
    --sucesso-2:#39c46e;
    --publicar:#2e8b57;
    --alerta:#ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Segoe UI", Arial, system-ui, sans-serif;
    background:var(--gray-bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{text-decoration:none;color:inherit;}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}

  /* ---------- Layout shell ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{max-width:1000px;margin:0 auto;width:100%;padding:0 24px;}

  header.topbar{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:var(--white);
    padding:22px 0 26px 0;
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand-logo{
    height:44px;width:auto;display:block;flex-shrink:0;
    border-radius:6px;
  }
  .brand-text h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.2px;}
  .brand-text p{margin:2px 0 0 0;font-size:12.5px;color:#c9d7e6;font-weight:400;}
  .meeting-chip{
    font-size:12.5px;color:#dfe9f3;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    padding:5px 12px;border-radius:20px;margin-top:8px;display:inline-block;
    font-family:inherit;transition:background .15s ease;
  }
  button.meeting-chip:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);}
  nav.topnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .context-switch{
    display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
    border-radius:9px;padding:3px;gap:2px;margin-right:4px;
  }
  .context-switch button{
    background:transparent;border:none;color:#dfe9f3;padding:8px 13px;border-radius:7px;
    font-size:12.5px;font-weight:700;white-space:nowrap;transition:background .15s ease,color .15s ease;
  }
  .context-switch button:hover{background:rgba(255,255,255,.12);}
  .context-switch button.active{background:var(--white);color:var(--navy);}
  .nav-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:var(--white);
    padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;
    transition:background .15s ease;
    display:flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .nav-btn:hover{background:rgba(255,255,255,.18);}
  .nav-btn.active{background:var(--white);color:var(--navy);}

  main{flex:1;padding:28px 0 60px 0;}

  /* ---------- Indicators ---------- */
  .indicators{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .indicator{
    background:var(--white);border:1px solid var(--border);border-radius:10px;
    padding:12px 18px;flex:1;min-width:130px;
    box-shadow:0 1px 2px rgba(0,20,40,.04);
  }
  .indicator .num{font-size:24px;font-weight:800;color:var(--navy);line-height:1;}
  .indicator .lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .indicator.accent .num{color:var(--orange);}

  /* ---------- Section headers ---------- */
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px 0;flex-wrap:wrap;gap:10px;}
  .section-title{font-size:13px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;}
  .section-title small{display:block;text-transform:none;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0;margin-top:2px;}

  .btn{
    border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;transition:background .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--orange);color:var(--white);}
  .btn-primary:hover{background:var(--orange-hover);}
  .btn-navy{background:var(--navy);color:var(--white);}
  .btn-navy:hover{background:var(--navy-dark);}
  .btn-ghost{background:var(--white);color:var(--navy);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--orange-soft);border-color:var(--orange-soft2);}
  .btn-danger{background:var(--white);color:var(--problema);border:1px solid var(--orange-soft2);}
  .btn-danger:hover{background:var(--orange-soft);}
  .btn-sm{padding:7px 12px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}
  .btn-lg{padding:16px 28px;font-size:16px;border-radius:10px;}
  .icon-btn{
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--white);
    width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .icon-btn:hover{background:rgba(255,255,255,.18);}

  /* ---------- Evolution card ---------- */
  .evo-card{
    background:var(--white);border:1px solid var(--border);border-radius:12px;
    padding:18px 22px;box-shadow:0 1px 2px rgba(0,20,40,.04);
    display:flex;gap:26px;flex-wrap:wrap;
  }
  .evo-item{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);font-weight:600;}
  .evo-item .evo-icon{font-size:16px;width:22px;text-align:center;}
  .evo-item.resolved .evo-icon{color:var(--sucesso);}
  .evo-item.new .evo-icon{color:var(--navy);}
  .evo-item.updated .evo-icon{color:var(--orange);}
  .evo-item.reopened .evo-icon{color:var(--indeterminado);}

  /* ---------- Subject cards ---------- */
  .subjects-list{display:flex;flex-direction:column;gap:12px;}
  .subject-card{
    position:relative;background:var(--white);border:1px solid var(--border);border-radius:12px;
    padding:16px 18px 16px 18px;box-shadow:0 1px 2px rgba(0,20,40,.04);
    display:flex;gap:14px;align-items:flex-start;transition:box-shadow .15s ease, border-color .15s ease;
    overflow:hidden;
  }
  .subject-card:hover{box-shadow:0 4px 14px rgba(0,20,40,.08);border-color:#d8dee5;cursor:pointer;}
  .subject-card.attention::before{
    content:"";position:absolute;top:0;left:0;width:5px;height:100%;background:var(--problema);
  }
  .subject-card.dragging{opacity:.4;}
  .subject-card.drag-over{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft2) inset, 0 4px 14px rgba(0,20,40,.08);}
  .drag-handle{
    flex-shrink:0;width:16px;text-align:center;color:var(--muted);font-size:16px;line-height:1;
    cursor:grab;user-select:none;margin-top:4px;letter-spacing:-2px;
  }
  .drag-handle:active{cursor:grabbing;}
  .subject-card:hover .drag-handle{color:var(--navy);}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;margin-top:6px;}
  .dot.red{background:var(--problema);}
  .dot.orange{background:var(--alerta);}
  .dot.green{background:var(--sucesso);}
  .dot.gray{background:var(--indeterminado);}
  .subject-main{flex:1;min-width:0;}
  .subject-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .subject-title{font-size:15px;font-weight:700;color:var(--text);}
  .subject-ticket{font-size:12px;color:var(--muted);font-weight:600;}
  .subject-changed{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45;}
  .subject-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
    padding:4px 10px;border-radius:20px;letter-spacing:.2px;white-space:nowrap;
  }
  .class-tag{font-size:11px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:4px;}
  .checkpoint-tag{
    font-size:11px;color:var(--navy);font-weight:600;background:var(--gray-bg);
    border:1px solid var(--border);padding:2px 8px;border-radius:12px;display:inline-flex;align-items:center;gap:4px;
  }
  .origin-tag{
    font-size:11px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:4px;
    cursor:pointer;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px;
  }
  .origin-tag:hover{color:var(--orange);text-decoration-color:var(--orange);}
  .card-arrow{align-self:center;color:var(--muted);font-size:18px;flex-shrink:0;}

  .subject-card.selectable{cursor:pointer;}
  .subject-card.selected{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft2) inset;}
  .select-checkbox{
    flex-shrink:0;width:20px;height:20px;border-radius:5px;border:2px solid var(--border);
    margin-top:2px;display:flex;align-items:center;justify-content:center;
    color:var(--white);font-size:13px;font-weight:800;transition:background .12s ease, border-color .12s ease;
  }
  .select-checkbox.checked{background:var(--orange);border-color:var(--orange);}

  .selection-bar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:var(--orange-soft);border:1px solid var(--orange-soft2);border-radius:10px;
    padding:12px 16px;margin-bottom:14px;
  }
  .selection-count{font-size:13.5px;font-weight:700;color:var(--navy);}

  .empty-state{
    background:var(--white);border:1px dashed var(--border);border-radius:12px;
    padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;
  }
  .empty-state .big{font-size:30px;margin-bottom:8px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,20,30,.45);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:200;
  }
  .modal{
    background:var(--white);border-radius:14px;width:100%;max-width:560px;
    box-shadow:0 20px 60px rgba(0,20,40,.25);animation:modalIn .15s ease;
  }
  @keyframes modalIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--border);
  }
  .modal-head h2{margin:0;font-size:17px;color:var(--navy);font-weight:700;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:6px;}
  .modal-close:hover{background:var(--gray-bg);}
  .modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;}
  .modal-foot.split{justify-content:space-between;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;color:var(--text);background:var(--white);
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--orange);}
  .field textarea{resize:vertical;min-height:56px;line-height:1.4;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}

  /* ---------- Detail view ---------- */
  .detail-status-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .detail-block{margin-bottom:18px;}
  .detail-block h3{margin:0 0 6px 0;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);font-weight:700;}
  .detail-block p{margin:0;font-size:14px;line-height:1.55;color:var(--text);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .detail-grid .g-lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .detail-grid .g-val{font-size:14px;color:var(--text);margin-top:2px;}
  .timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--orange-soft2);margin-left:6px;}
  .timeline li{position:relative;padding:0 0 16px 20px;}
  .timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid var(--white);box-shadow:0 0 0 2px var(--orange-soft2);}
  .timeline li:last-child{padding-bottom:0;}
  .timeline .t-date{font-size:11.5px;font-weight:700;color:var(--navy);}
  .timeline .t-text{font-size:13.5px;color:var(--text);margin-top:2px;}

  /* ---------- Meetings view ---------- */
  .meeting-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--white);border:1px solid var(--border);border-radius:12px;
    padding:16px 20px;margin-bottom:10px;transition:box-shadow .15s ease;
  }
  .meeting-row:hover{box-shadow:0 4px 14px rgba(0,20,40,.08);cursor:pointer;}
  .meeting-row .m-date{font-size:15px;font-weight:700;color:var(--navy);}
  .meeting-row .m-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .meeting-row .m-badge{font-size:12px;font-weight:700;color:var(--muted);background:var(--gray-bg);padding:5px 12px;border-radius:20px;}
  .meeting-row.current{border-color:var(--orange-soft2);background:var(--orange-soft);}
  .meeting-row.current .m-badge{color:var(--orange);background:var(--white);}

  /* ---------- Presentation mode ---------- */
  .present-overlay{
    position:fixed;inset:0;background:var(--navy-dark);z-index:500;
    display:flex;flex-direction:column;color:var(--white);
  }
  .present-top{display:flex;justify-content:space-between;align-items:center;padding:20px 34px;}
  .present-logo{height:36px;width:auto;display:block;border-radius:5px;flex-shrink:0;}
  .present-top-right{display:flex;align-items:center;gap:18px;}
  .present-progress{font-size:12.5px;color:#b8c8d8;font-weight:600;letter-spacing:.3px;}
  .present-close{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--white);width:38px;height:38px;border-radius:8px;font-size:16px;}
  .present-close:hover{background:rgba(255,255,255,.2);}
  .present-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 60px;overflow-y:auto;}
  .present-slide{max-width:820px;width:100%;}
  .present-eyebrow{font-size:13px;color:var(--orange-hover);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
  .present-slide h1{font-size:40px;margin:0 0 10px 0;font-weight:800;letter-spacing:-.5px;}
  .present-slide h2{font-size:30px;margin:0 0 28px 0;font-weight:800;letter-spacing:-.3px;border-bottom:3px solid var(--orange);padding-bottom:14px;display:inline-block;}
  .present-date{font-size:17px;color:#c9d7e6;margin-bottom:32px;}
  .present-stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:10px;}
  .present-stat .n{font-size:36px;font-weight:800;color:var(--white);}
  .present-stat .l{font-size:13px;color:#9db2c6;text-transform:uppercase;letter-spacing:.4px;margin-top:2px;}
  .present-evo-list{display:flex;flex-direction:column;gap:18px;}
  .present-evo-list .pe-item{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:700;}
  .present-evo-list .pe-icon{width:40px;text-align:center;font-size:26px;}
  .present-items{display:flex;flex-direction:column;gap:16px;}
  .present-item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:16px 20px;}
  .present-item .pi-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .present-item .pi-title{font-size:18px;font-weight:700;}
  .present-item .pi-ticket{font-size:12.5px;color:#9db2c6;font-weight:600;}
  .present-item .pi-changed{font-size:14.5px;color:#d6e2ec;margin-top:8px;line-height:1.5;}
  .present-item .pi-next{font-size:13.5px;color:var(--orange-hover);margin-top:6px;font-weight:600;}
  .present-nav{display:flex;justify-content:space-between;align-items:center;padding:22px 34px;border-top:1px solid rgba(255,255,255,.1);}
  .present-dots{display:flex;gap:6px;}
  .present-dots span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);}
  .present-dots span.on{background:var(--orange);}
  .present-navbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--white);padding:10px 20px;border-radius:8px;font-size:14px;font-weight:700;}
  .present-navbtn:hover{background:rgba(255,255,255,.2);}
  .present-navbtn:disabled{opacity:.3;cursor:default;}
  .present-empty{color:#9db2c6;font-size:16px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--navy-dark);color:var(--white);padding:12px 20px;border-radius:8px;
    font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:600;
    opacity:0;transition:opacity .2s ease, transform .2s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,-4px);}

  footer.app-footer{padding:20px 0 30px 0;text-align:center;font-size:12px;color:var(--muted);}

  /* ---------- Responsive ---------- */
  @media (max-width:760px){
    .field-row{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    .present-slide h1{font-size:28px;}
    .present-slide h2{font-size:22px;}
    .present-stage{padding:16px 22px;}
    .present-top,.present-nav{padding:14px 18px;}
    .brand-text h1{font-size:18px;}
  }
  @media (max-width:520px){
    .indicators{gap:8px;}
    .indicator{min-width:44%;padding:10px 12px;}
    .topnav .nav-label{display:none;}
  }
</style>
</head>

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  if(!y||!m||!d) return iso;
  return d+'/'+m+'/'+y;
}
function fmtDateLong(iso){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const [y,m,d] = iso.split('-').map(Number);
  return d + ' de ' + meses[m-1] + ' de ' + y;
}

/* Checkpoints começam vazios — trilha de dados totalmente independente da quinzenal */
function seedCheckpointData(){
  return {
    subjects: [],
    meetings: [],
    current: { date: todayISO(), subjectIds: [] }
  };
}

function freshMultiContextState(){
  return {
    contexts: {
      quinzenal: seedQuinzenalData(),
      checkpoint: seedCheckpointData()
    }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshMultiContextState();
    const parsed = JSON.parse(raw);
    if(!parsed) return freshMultiContextState();

    // Já está no formato novo (com contextos separados)
    if(parsed.contexts){
      if(!parsed.contexts.quinzenal) parsed.contexts.quinzenal = seedQuinzenalData();
      if(!parsed.contexts.checkpoint) parsed.contexts.checkpoint = seedCheckpointData();
      return parsed;
    }

    // Formato antigo (anterior à separação Quinzenal/Checkpoint): migrar preservando os dados
    if(parsed.subjects && parsed.meetings && parsed.current){
      return {
        contexts: {
          quinzenal: { subjects: parsed.subjects, meetings: parsed.meetings, current: parsed.current },
          checkpoint: seedCheckpointData()
        }
      };
    }
    return freshMultiContextState();
  }catch(e){
    return freshMultiContextState();
  }
}

/* ============================================================
   Helpers de domínio
   ============================================================ */
function getSubject(id){ return ctxData().subjects.find(s=>s.id===id); }
function getCurrentSubjects(){
  return ctxData().current.subjectIds.map(getSubject).filter(Boolean);
}
function isResolvedStatus(status){ return status && status.indexOf('Resolvido') === 0; }
function isAttention(s){ return s.classification === 'Ponto de atenção'; }
function lastMeeting(){ const m = ctxData().meetings; return m.length ? m[m.length-1] : null; }

function dotColor(s){
  if(isResolvedStatus(s.status)) return 'green';
  if(isAttention(s)) return 'red';
  if(['Pendente','Aguardando','Reaberto'].includes(s.status)) return 'orange';
  return 'gray';
}

function computeEvolution(){
  const prev = lastMeeting();
  const current = getCurrentSubjects();
  const evo = {resolved:0, new:0, updated:0, reopened:0};
  if(!prev){ evo.new = current.length; return evo; }
  const prevMap = {};
  prev.items.forEach(i=>prevMap[i.id]=i);
  current.forEach(s=>{
    const p = prevMap[s.id];
    if(!p){ evo.new++; return; }
    const wasResolved = isResolvedStatus(p.status);
    const isResolvedNow = isResolvedStatus(s.status);
    if(isResolvedNow && !wasResolved){ evo.resolved++; }
    else if(s.status==='Reaberto' && wasResolved){ evo.reopened++; }
    else if(s.lastUpdate !== p.lastUpdate || s.whatChanged !== p.whatChanged || s.status !== p.status){ evo.updated++; }
  });
  return evo;
}

/* Ordenação manual dos assuntos: agrupa por "bucket" (atenção/normal/resolvido) e depois
   por classificação (ordem fixa), respeitando dentro de cada classificação a ordem manual
   definida pelo usuário via arrastar-e-soltar (campo subject.order). */
function bucketRank(s){ return isAttention(s) ? 0 : (isResolvedStatus(s.status) ? 2 : 1); }
function classRank(s){ const i = CLASS_LIST.indexOf(s.classification); return i===-1 ? 99 : i; }
function getOrderedSubjects(){
  const cur = getCurrentSubjects();
  return [...cur].sort((a,b)=>{
    const rb = bucketRank(a) - bucketRank(b);
    if(rb !== 0) return rb;
    const cb = classRank(a) - classRank(b);
    if(cb !== 0) return cb;
    const oa = (typeof a.order === 'number') ? a.order : 999999;
    const ob = (typeof b.order === 'number') ? b.order : 999999;
    return oa - ob;
  });
}
/* Migração leve: garante que todo assunto tenha um número de ordem manual dentro da sua classificação */
function ensureSubjectOrder(subjectsArr){
  const counters = {};
  subjectsArr.forEach(s=>{
    const c = s.classification || 'Normal';
    if(typeof s.order !== 'number'){
      counters[c] = (counters[c] === undefined) ? 0 : counters[c];
      s.order = counters[c]++;
    } else {
      counters[c] = Math.max((counters[c] === undefined) ? -1 : counters[c], s.order + 1);
    }
  });
}

function nextOrderForClassificationIn(ctx, cls){
  const siblings = ctx.subjects.filter(s=>s.classification===cls);
  return siblings.reduce((max,s)=> typeof s.order==='number' ? Math.max(max, s.order+1) : max, 0);
}
function nextOrderForClassification(cls){
  return nextOrderForClassificationIn(ctxData(), cls);
}

function upsertSubject(data, id){
  const isNew = !id;
  if(isNew){
    const s = {
      id: uid('s'),
      ticket:data.ticket, title:data.title, area:data.area,
      status:data.status, priority:data.priority, classification:data.classification,
      forecast:data.forecast, lastUpdate:data.lastUpdate,
      whatChanged:data.whatChanged, whatToHighlight:data.whatToHighlight, note:data.note,
      createdAt: todayISO(),
      order: nextOrderForClassification(data.classification),
      timeline:[{date:fmtDate(data.lastUpdate)||fmtDate(todayISO()), text:data.whatChanged || 'Assunto cadastrado.'}]
    };
    ctxData().subjects.push(s);
    ctxData().current.subjectIds.push(s.id);
    showToast('Assunto cadastrado.');
  } else {
    const s = getSubject(id);
    const classificationChanged = s.classification !== data.classification;
    const changed = (s.whatChanged !== data.whatChanged) || (s.lastUpdate !== data.lastUpdate) || (s.status !== data.status);
    Object.assign(s, data);
    if(classificationChanged){
      // ao mudar de classificação, o assunto vai para o final da nova classificação
      s.order = nextOrderForClassification(data.classification);
    }
    if(changed){
      s.timeline.unshift({date:fmtDate(data.lastUpdate)||fmtDate(todayISO()), text:data.whatChanged || ('Status atualizado para ' + data.status + '.')});
      s.timeline = s.timeline.slice(0,12);
    }
    showToast('Assunto atualizado.');
  }
  saveState();
}

function deleteSubject(id){

  ctxData().current.subjectIds = ctxData().current.subjectIds.filter(x=>x!==id);

  showToast('Assunto excluído.');
}

/* ============================================================
   Cópia de assuntos: Reunião Quinzenal → Checkpoint
   (cópia independente, não sincronizada; direção única)
   ============================================================ */
function checkpointCopiesOf(quinzenalSubjectId){
  return state.contexts.checkpoint.subjects.filter(s=>s.originContext==='quinzenal' && s.originSubjectId===quinzenalSubjectId);
}
function latestCheckpointCopyDate(quinzenalSubjectId){
  const copies = checkpointCopiesOf(quinzenalSubjectId);
  if(!copies.length) return null;
  return copies.reduce((max,c)=> (!max || c.copyMeetingDate > max) ? c.copyMeetingDate : max, null);
}

function copySubjectsToCheckpoint(subjectIds, checkpointDateISO){
  const cp = state.contexts.checkpoint;
  cp.current.date = checkpointDateISO;

  const alreadyInTarget = new Set(
    cp.current.subjectIds
      .map(id=>cp.subjects.find(s=>s.id===id))
      .filter(Boolean)
      .filter(s=>s.originContext==='quinzenal')
      .map(s=>s.originSubjectId)
  );

  const sourceDate = ctxData().current.date; // ctxData() aqui é o contexto ativo (Quinzenal), de onde partiu a cópia
  const added = [], skipped = [];

  subjectIds.forEach(srcId=>{
    const src = getSubject(srcId);
    if(!src) return;
    if(alreadyInTarget.has(srcId)){ skipped.push(src.title); return; }

    const copy = {
      id: uid('s'),
      ticket: src.ticket, title: src.title, area: src.area,
      status: src.status, priority: src.priority, classification: src.classification,
      forecast: src.forecast, lastUpdate: src.lastUpdate,
      whatChanged: src.whatChanged, whatToHighlight: src.whatToHighlight, note: src.note,
      createdAt: todayISO(),
      order: nextOrderForClassificationIn(cp, src.classification),
      timeline: [{date: fmtDate(todayISO()), text: 'Copiado da Reunião Quinzenal de ' + fmtDate(sourceDate) + '.'}],
      originContext: 'quinzenal',
      originSubjectId: src.id,
      originLabel: 'Reunião Quinzenal - ' + fmtDate(sourceDate),
      copyMeetingDate: checkpointDateISO
    };
    cp.subjects.push(copy);
    cp.current.subjectIds.push(copy.id);
    alreadyInTarget.add(srcId);
    added.push(src.title);
  });

  saveState();
  return { added, skipped, checkpointDate: checkpointDateISO };
}

function goToOrigin(originSubjectId){
  const q = state.contexts.quinzenal;
  if(q.current.subjectIds.includes(originSubjectId)){
    switchContext('quinzenal');
    openModal({type:'detail', id:originSubjectId});
    return;
  }
  const meeting = q.meetings.find(m=>m.items.some(it=>it.id===originSubjectId));
  if(meeting){
    switchContext('quinzenal');
    setView('meeting-detail', {meetingId: meeting.id});
    return;
  }
  showToast('Não foi possível localizar a reunião de origem (o assunto pode ter sido excluído).');
}

function finalizeMeeting(silent){
  const items = getCurrentSubjects().map(s=>({...s, timeline:[...s.timeline]}));
  ctxData().meetings.push({ id: uid('m'), date: ctxData().current.date, items });
  saveState();
  if(!silent) showToast(contextMeta().termCap + ' salvo(a) no histórico.');
}

function deleteMeeting(id){
  ctxData().meetings = ctxData().meetings.filter(m=>m.id!==id);
  saveState();
  showToast(contextMeta().termCap + ' excluído(a) do histórico.');
}

/* Assuntos "órfãos": existem na lista viva de assuntos, mas não estão nem na reunião
   atual, nem em nenhuma reunião já arquivada. Isso pode acontecer se uma reunião foi
   substituída por "Nova reunião" antes de ser finalizada (bug corrigido nesta versão).
   Esta checagem permite recuperar esses dados em vez de deixá-los invisíveis. */
function findOrphanSubjects(){
  const cur = ctxData().current;
  const inCurrent = new Set(cur.subjectIds);
  const inMeetings = new Set();
  ctxData().meetings.forEach(m=>m.items.forEach(it=>inMeetings.add(it.id)));
  return ctxData().subjects.filter(s=>!inCurrent.has(s.id) && !inMeetings.has(s.id));
}
function recoverOrphanSubjects(){
  const orphans = findOrphanSubjects();
  if(!orphans.length){ showToast('Nenhum assunto órfão encontrado.'); return; }
  orphans.forEach(s=>ctxData().current.subjectIds.push(s.id));
  saveState();
  closeModal();
  setView('home');
  showToast(orphans.length + ' assunto(s) recuperado(s) e adicionado(s) à ' + contextMeta().term + ' atual.');
}

function startNewMeeting(dateISO, copyFromPrevious){
  const cur = ctxData().current;
  const last = lastMeeting();
  const alreadySaved = last && last.date === cur.date;

  // Arquiva automaticamente a reunião em andamento se ela ainda não foi finalizada,
  // para que nenhum dado seja perdido/sobrescrito ao iniciar uma nova.
  let autoArchived = false;
  if(cur.subjectIds.length && !alreadySaved){
    finalizeMeeting(true);
    autoArchived = true;
  }

  if(copyFromPrevious){
    const prev = lastMeeting(); // após o arquivamento acima, é sempre a reunião mais recente correta
    ctxData().current.subjectIds = prev ? prev.items.map(i=>i.id).filter(id=>getSubject(id)) : [];
  } else {
    ctxData().current.subjectIds = [];
  }
  ctxData().current.date = dateISO;
  saveState();
  showToast(autoArchived
    ? contextMeta().termCap + ' anterior arquivado(a) automaticamente e novo(a) ' + contextMeta().term + ' criado(a).'
    : 'Novo(a) ' + contextMeta().term + ' criado(a).');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed && parsed.contexts && parsed.contexts.quinzenal && parsed.contexts.checkpoint){
        state = parsed;
      } else if(parsed && parsed.subjects && parsed.current){
        // Backup no formato antigo (anterior à separação Quinzenal/Checkpoint):
        // migra para "Reuniões Quinzenais" e preserva os Checkpoints já existentes.
        state = {
          contexts: {
            quinzenal: { subjects: parsed.subjects, meetings: parsed.meetings || [], current: parsed.current },
            checkpoint: (state && state.contexts && state.contexts.checkpoint) ? state.contexts.checkpoint : seedCheckpointData()
          }
        };
      } else {
        throw new Error('formato inválido');
      }
      saveState();
      closeModal();
      setView('home');
      showToast('Backup importado com sucesso.');
    }catch(err){
      showToast('Não foi possível importar este arquivo.');
    }
  };
  reader.readAsText(file);
}

/* ---------- Arrastar e soltar (reordenação manual dentro da mesma classificação) ---------- */
let dragState = null;
let suppressCardClick = false;

function handleSubjectClick(event, id){
  if(selectionMode && activeContext === 'quinzenal'){
    toggleSelectSubject(id);
    return;
  }
  if(suppressCardClick){ suppressCardClick = false; return; }
  openModal({type:'detail', id});
}

function onSubjectDragStart(e, id){
  if(selectionMode){ e.preventDefault(); return; }
  const s = getSubject(id);
  if(!s) return;
  dragState = { id, classification: s.classification };
  suppressCardClick = true;
  try{ e.dataTransfer.setData('text/plain', id); }catch(err){}
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}

function onSubjectDragOver(e, overId){
  if(!dragState || overId === dragState.id) return;
  const overSubject = getSubject(overId);
  if(!overSubject || overSubject.classification !== dragState.classification){
    e.dataTransfer.dropEffect = 'none';
    return; // classificação diferente: não permite soltar aqui
  }
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onSubjectDragLeave(e){
  e.currentTarget.classList.remove('drag-over');
}

function onSubjectDrop(e, overId){
  e.preventDefault();
  document.querySelectorAll('.subject-card.drag-over').forEach(el=>el.classList.remove('drag-over'));
  if(!dragState) return;
  const draggedId = dragState.id;
  dragState = null;
  if(draggedId === overId) return;
  const dragged = getSubject(draggedId);
  const target = getSubject(overId);
  if(!dragged || !target || dragged.classification !== target.classification){
    showToast('Só é possível reordenar assuntos dentro da mesma classificação.');
    return;
  }
  reorderWithinClassification(draggedId, overId);
}

function onSubjectDragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.subject-card.drag-over').forEach(el=>el.classList.remove('drag-over'));
  dragState = null;
  setTimeout(()=>{ suppressCardClick = false; }, 0);
}

function reorderWithinClassification(draggedId, targetId){
  const cls = getSubject(draggedId).classification;
  const group = getOrderedSubjects().filter(s=>s.classification===cls);
  const fromIdx = group.findIndex(s=>s.id===draggedId);
  const toIdx = group.findIndex(s=>s.id===targetId);
  if(fromIdx===-1 || toIdx===-1) return;
  const [moved] = group.splice(fromIdx,1);
  group.splice(toIdx,0,moved);
  group.forEach((s,i)=>{ s.order = i; });
  saveState();
  render();
}

function escapeHtml(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildSlides(){
  const c = counts();
  const evo = computeEvolution();
  const cur = getOrderedSubjects();
  const attention = cur.filter(isAttention);
  const rootCause = cur.filter(s=>!isAttention(s) && (s.classification==='Causa raiz' || s.classification==='Recorrente' || s.status==='Resolvido - Causa Raiz'));
  const resolved = cur.filter(s=>isResolvedStatus(s.status) && !rootCause.includes(s));
  const shown = new Set([...attention, ...rootCause, ...resolved].map(s=>s.id));
  const ongoing = cur.filter(s=>!shown.has(s.id));

  const slides = [];
  slides.push({type:'cover', data:{date:ctxData().current.date, c, meta:contextMeta()}});
  slides.push({type:'evolution', data:{evo}});

  function pushGroup(title, list){
    if(!list.length) return;
    const chunkSize = 4;
    for(let i=0;i<list.length;i+=chunkSize){
      slides.push({type:'group', data:{title: title + (i>0 ? ' (continuação)' : ''), items:list.slice(i,i+chunkSize)}});
    }
  }
  pushGroup('Pontos de atenção', attention);
  pushGroup('Causa raiz / Recorrências', rootCause);
  pushGroup('Em acompanhamento', ongoing);
  pushGroup('Resolvidos', resolved);

  return slides;
}
let presentSlides = [];

function startPresentation(){
  presentSlides = buildSlides();
  presentIndex = 0;
  view = 'present';
  render();
}
function exitPresentation(){
  view = 'home';

}
function presentNav(delta){
  presentIndex = Math.max(0, Math.min(presentSlides.length-1, presentIndex+delta));

        <h2>${title}</h2>
        <div class="present-items">
          ${items.map(s=>`
            <div class="present-item">
              <div class="pi-top">
                <span class="pi-title">${escapeHtml(s.title)}</span>
                <span class="pi-ticket">#${escapeHtml(s.ticket)} • ${s.status}</span>
              </div>
              <div class="pi-changed">${escapeHtml(s.whatChanged)||'—'}</div>
              ${s.whatToHighlight ? `<div class="pi-next">Próximo passo: ${escapeHtml(s.whatToHighlight)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>`;
  }
  return `<div class="present-slide"><p class="present-empty">Nada para mostrar.</p></div>`;
}

function renderPresent(){
  if(!presentSlides.length) presentSlides = buildSlides();
  const slide = presentSlides[presentIndex];
  return `
  <div class="present-overlay">
    <div class="present-top">
      <img class="present-logo" src="${FGV_LOGO}" alt="FGV">
      <div class="present-top-right">
        <div class="present-progress">Slide ${presentIndex+1} de ${presentSlides.length}</div>
        <button class="present-close" onclick="exitPresentation()" title="Fechar (Esc)">✕</button>
      </div>
    </div>
    <div class="present-stage">
      ${renderPresentSlide(slide)}
    </div>
    <div class="present-nav">
      <button class="present-navbtn" onclick="presentNav(-1)" ${presentIndex===0?'disabled':''}>← Anterior</button>
      <div class="present-dots">
        ${presentSlides.map((_,i)=>`<span class="${i===presentIndex?'on':''}"></span>`).join('')}
      </div>
      <button class="present-navbtn" onclick="presentNav(1)" ${presentIndex===presentSlides.length-1?'disabled':''}>Próximo →</button>
    </div>
  </div>`;
}

/* ============================================================
   Render principal
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(view==='present'){
    app.innerHTML = renderPresent() + `<div id="toast" class="toast"></div>`;
    return;
  }

  let body = '';
  if(view==='home') body = renderHome();
  else if(view==='attention') body = renderAttention();
  else if(view==='meetings') body = renderMeetings();
  else if(view==='meeting-detail') body = renderMeetingDetail();
  else body = renderHome();

  let modalHtml = '';
  if(modal){
    if(modal.type==='form') modalHtml = renderFormModal();
    else if(modal.type==='detail') modalHtml = renderDetailModal();
    else if(modal.type==='finalize') modalHtml = renderFinalizeModal();
    else if(modal.type==='newmeeting') modalHtml = renderNewMeetingModal();
    else if(modal.type==='addtocheckpoint') modalHtml = renderAddToCheckpointModal();
    else if(modal.type==='editdate') modalHtml = renderEditDateModal();
    else if(modal.type==='settings') modalHtml = renderSettingsModal();
  }

  app.innerHTML = `
    ${renderHeader()}
    <main>${body}</main>
    <footer class="app-footer">Acompanhamento Técnico • HUB Suporte Técnico FGV</footer>
    ${modalHtml}
    <div id="toast" class="toast"></div>
  `;
}

document.addEventListener('keydown', (e)=>{
  if(view==='present'){
    if(e.key==='Escape') exitPresentation();
    if(e.key==='ArrowRight') presentNav(1);
    if(e.key==='ArrowLeft') presentNav(-1);
  } else if(e.key==='Escape' && modal){
    closeModal();
  }
});

render();
</script>
</body>
</html>
